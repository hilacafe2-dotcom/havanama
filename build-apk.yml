name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle app JavaScript with CapacitorHttp
        run: npm run build

      - name: Add Vazirmatn font
        run: |
          mkdir -p www/fonts
          f=$(find node_modules/vazirmatn -iname '*wght*.woff2' | head -n 1)
          if [ -z "$f" ]; then f=$(find node_modules/vazirmatn -iname 'Vazirmatn-Regular.woff2' | head -n 1); fi
          if [ -n "$f" ]; then cp "$f" www/fonts/Vazirmatn.woff2; echo "font: $f"; else echo "font not found"; fi

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: havanama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
